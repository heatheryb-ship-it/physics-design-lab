<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Design Lab | Amusement Park Redesign</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18293b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142b47;color:white;padding:25px max(20px,calc((100vw - 1100px)/2))}header h1{margin:4px 0;font-size:1.7rem}header p{margin:5px 0;color:#cbd8e9}.shell{max-width:1100px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:245px 1fr;gap:20px}aside,.panel{background:white;border:1px solid #d9e1eb;border-radius:14px;padding:20px;box-shadow:0 2px 8px #18293b0a}aside{align-self:start;position:sticky;top:15px}nav button{display:block;text-align:left;width:100%;margin:8px 0;background:#f2f5f9;border:1px solid #d8e1eb;color:#23384f;padding:12px;border-radius:9px;font-weight:650}nav button.active{background:#e2efff;border-color:#6c9fd7}nav button:disabled{opacity:.43;cursor:not-allowed}.eyebrow{color:#58718b;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700}h2{margin:8px 0 12px;font-size:1.55rem}h3{margin:24px 0 8px}p,li{line-height:1.65}.callout{background:#edf5ff;border-left:4px solid #4176b7;padding:13px 16px;border-radius:7px;margin:16px 0}.example{background:#f6f8fb;border:1px solid #dfe7f0;padding:14px;border-radius:9px;margin:14px 0}.question{padding:15px;border:1px solid #d9e1eb;border-radius:10px;margin:14px 0}.question label{display:block;margin:10px 0;padding:8px;background:#f6f8fb;border-radius:7px;cursor:pointer}.feedback{font-weight:600;margin:8px 0}.ok{color:#187343}.no{color:#a4432b}button.action{border:0;background:#215d9e;color:white;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#e9eff6;color:#213b59}button:disabled{opacity:.45;cursor:not-allowed}textarea,input[type=number],input[type=text]{font:inherit;border:1px solid #aabacd;border-radius:7px;padding:10px;width:100%}textarea{min-height:90px;resize:vertical}.prompt{margin:17px 0}.prompt label{display:block;font-weight:650;margin-bottom:7px}table{border-collapse:collapse;width:100%;margin:15px 0;font-size:.92rem}td,th{border:1px solid #d4dfeb;padding:9px;text-align:left}th{background:#edf2f7}.tablewrap{overflow:auto}svg{max-width:100%;height:auto}.progress{background:#e0e8f0;border-radius:100px;height:12px;overflow:hidden}.progress>div{background:#3d7ec1;height:100%;transition:width .2s}.small{font-size:.86rem;color:#52677e}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{padding:13px;border-radius:9px;background:#edf4fb}.metric strong{font-size:1.45rem;display:block}input[type=range]{width:100%}.footer{margin-top:30px;border-top:1px solid #d9e1eb;padding-top:15px}.locked{font-size:.85rem;color:#627589}@media(max-width:760px){.shell{display:block}aside{position:static;margin-bottom:15px}nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}nav button{margin:0}.grid{grid-template-columns:1fr}}@media print{aside,button,.controls{display:none!important}.shell{display:block}.panel{border:0;box-shadow:none}textarea{min-height:65px}}
</style></head><body><header><div class="eyebrow" style="color:#b7d6fa">Independent learning course</div><h1>Physics Design Lab: Amusement Park Redesign</h1><p>Six guided lessons · Learn the physics · Test ideas · Make your own engineering decisions</p></header><div class="shell"><aside><b>Course progress</b><p class="small" id="progressText"></p><div class="progress"><div id="progressBar"></div></div><nav id="nav"></nav><hr><button class="action secondary" id="exportBtn">Export my work</button><button class="action secondary" id="printBtn">Print this lesson</button><p class="small">Work is saved in this browser on this device. Export regularly if using a shared computer.</p></aside><main class="panel" id="lesson"></main></div><script>
const lessons=[
{title:'Newton’s Three Laws',time:'20–25 min',intro:'Build a foundation for explaining why rides start, stop, accelerate, and push on riders.',sections:[['First Law — inertia','An object stays at rest or continues at constant velocity unless a net external force changes its motion. A moving object does not need a continuous net force to keep moving at constant velocity.'],['Second Law — acceleration','The vector sum of forces determines acceleration: Fₙₑₜ = ma. For a given net force, increasing mass reduces acceleration. Always distinguish one applied force from the net force.'],['Third Law — interacting objects','When object A pushes on object B, B pushes back on A with an equal-magnitude, opposite-direction force. These forces do not cancel on one free-body diagram because they act on different objects.']],example:'Worked example (not from the assignment): A 12 kg equipment cart experiences a 36 N net horizontal force. Its acceleration is a = Fₙₑₜ/m = 36/12 = 3 m/s². If its mass doubles with the same net force, acceleration halves.',quiz:[['A puck moves at constant velocity on nearly frictionless ice. The net force is…',['Zero','In the direction of motion','Increasing'],0,'Constant velocity means zero acceleration, so net force is zero.'],['The same net force acts on two carts; one has twice the mass. Its acceleration is…',['Twice as large','Half as large','Unchanged'],1,'Use a = Fₙₑₜ/m.'],['A hand pushes on a wall. The wall’s reaction force acts on…',['The wall','The hand','Both as one force'],1,'Third-law forces act on different objects.']],prompts:[['Connect to the assignment','Choose one observed ride problem. Which law seems relevant, and what specific motion or interaction would you examine?'],['Check your reasoning','How could a ride be moving quickly while its acceleration is zero?']]},
{title:'Free-Body Diagrams',time:'20–25 min',intro:'Learn to isolate one object and identify every external force on it.',sections:[['Diagram procedure','1. Choose the object and moment. 2. Draw a dot or simple box. 3. Draw arrows for external forces acting ON that object. 4. Label gravity (mg), normal force (N), tension (T), friction (f), and applied force where appropriate. 5. Choose axes and decide which forces balance.'],['Avoid common errors','Velocity and acceleration are not forces. Do not draw the force an object exerts on something else on that object’s free-body diagram. A normal force is perpendicular to a contact surface; friction is parallel to it.'],['Net force by direction','Analyze horizontal and vertical directions separately: ΣFₓ = maₓ and ΣFᵧ = maᵧ. Balanced vertical forces do not imply balanced horizontal forces.']],example:'Worked example: A book resting on a level desk has gravity downward and normal force upward. Its vertical acceleration is zero, so the forces have equal magnitude. A horizontal push would add another force only if a push is actually present.',diagram:true,quiz:[['A box slides right across a rough horizontal floor with no one pushing it. Friction points…',['Right','Left','Up'],1,'Friction opposes relative sliding between surfaces.'],['Which belongs on the free-body diagram of a hanging mass?',['Its velocity arrow','The force it exerts on Earth','Gravity and rope tension'],2,'Only forces acting on the chosen object belong on its diagram.'],['A rider is not moving vertically. What can you conclude?',['Vertical forces balance','No forces act','Horizontal forces balance'],0,'No vertical acceleration means the sum of vertical forces is zero.']],prompts:[['Draw your first ride diagram','On paper, sketch a free-body diagram for one rider or vehicle in one ride. Label the chosen object, moment, and each force. Then explain the directions here.'],['Check your diagram','Which forces might change with weather, speed, rider mass, or surface materials?']]},
{title:'Collisions, Momentum & Energy',time:'25–30 min',intro:'Connect forces, stopping time, momentum, work, and conservation of energy.',sections:[['Momentum and impulse','Momentum is p = mv. Impulse is J = Δp = Fₐᵥg Δt, where Fₐᵥg is average net force. For the same momentum change, a longer stopping time means a smaller average net force.'],['Kinetic energy and work','Kinetic energy is KE = ½mv². Doubling speed quadruples kinetic energy. Work is energy transfer by force over distance: W = Fd for a constant force parallel to displacement.'],['Energy conservation','Energy is transferred and transformed, not destroyed. Mechanical energy can become thermal energy, sound, deformation, or stored elastic energy. A safety device must account for the energy transferred during a stop.'],['Important distinction','Average stopping force is not necessarily peak force. Stopping time, stopping distance, and speed profile matter. Never assume the force is constant without stating that assumption.']],example:'Worked example: A 20 kg cart moving at 3 m/s has KE = ½(20)(3²) = 90 J. If it stops in 1.5 s with uniform deceleration, average net force magnitude is |Δp|/Δt = (20×3)/1.5 = 40 N.',sim:true,quiz:[['If stopping time doubles for the same momentum change, average net force…',['Doubles','Halves','Stays the same'],1,'Use Fₐᵥg = Δp/Δt.'],['If speed doubles, kinetic energy becomes…',['Twice as large','Four times as large','Half as large'],1,'Speed is squared in KE = ½mv².'],['During an inelastic collision, some kinetic energy…',['Ceases to exist','Transfers into other forms','Must remain kinetic'],1,'Total energy is conserved even if kinetic energy is not.']],prompts:[['Compare two ideas','Describe two general ways to make a moving cart stop. Which quantities would you measure to compare them fairly?'],['Explain energy','Where might kinetic energy go when a vehicle is brought to rest? Identify more than one possible destination.']]},
{title:'Investigate the Three Rides',time:'30–40 min',intro:'Now transfer what you learned. You are the consultant; the course will ask questions rather than supply design answers.',sections:[['Bumper cars — collisions','Think about the direction and speed of each car before and after impact. Consider mass, momentum change, impact duration, contact materials, and energy transfer. Draw a free-body diagram during contact.'],['Zip line — stopping','Separate the forces acting along the direction of motion from those perpendicular to it. Think about how rider mass, slope, friction, and the stopping system could affect acceleration and stopping distance.'],['Rotor — circular motion','A rotating rider needs an inward net force: Fᶜ = mv²/r. This is the name for the required net inward force, not an extra force arrow. Consider which real contact force provides it and which force could oppose downward slipping.']],example:'Transfer example (different context): On a spinning playground platform, a rider moving in a circle changes velocity direction continuously. Even at constant speed, there is acceleration toward the center, a = v²/r.',quiz:[['A rider moves in a circle at constant speed. The rider…',['Has no acceleration','Accelerates toward the center','Accelerates outward'],1,'Direction of velocity changes, requiring inward acceleration.'],['Which is a real force that might point inward on a rotating rider?',['Centripetal force as an extra force','Normal force from the wall','Velocity'],1,'Centripetal describes the net inward force; identify its physical source.'],['A design works for one test rider. To establish reliability you should…',['Assume all riders are safe','Test relevant masses and conditions','Only test higher speed'],1,'A robust design must account for meaningful variability.']],prompts:[['Bumper cars — analyze','What forces act during collision? Explain how Newton’s Laws help you investigate the unpredictable impacts. Describe a diagram you will draw.'],['Bumper cars — propose and weigh trade-offs','Propose at least one change, then discuss safety, thrill, maintenance, cost, and possible drawbacks.'],['Zip line — analyze','Identify the forces, mass dependence, and measurements needed to explain variable stopping times. Describe a diagram.'],['Zip line — propose and weigh trade-offs','Propose a change and explain what evidence could show it works for different rider masses.'],['Rotor — analyze','Identify the inward and vertical forces. Describe a diagram and explain what must be true to prevent downward slipping.'],['Rotor — propose and weigh trade-offs','Propose a change, state its physics basis, and identify possible limitations.']]},
{title:'Build a Stopping Prototype',time:'30–40 min + construction',intro:'Design and test your own mechanism. Your work should distinguish prediction from measurement.',sections:[['Define measurable success','Specify the electric car’s initial speed, total moving mass, available stopping distance, and any acceleration limit provided by the teacher. If the limit is not provided, ask for it or label your assumed comparison threshold clearly; do not present it as a regulatory standard.'],['Explore design families','Investigate friction, elastic materials, magnetic systems, and energy-absorbing barriers. Compare how they transfer energy and how stopping force might vary during contact. Choose your own approach.'],['Control variables','Keep the starting conditions as consistent as possible. Change one factor at a time, repeat trials, and note uncertainty. For each test record total moving mass, initial speed, stopping time, and stopping distance.'],['Prototype safety','Use a small low-energy model, keep hands and faces out of its path, secure barriers, and have a teacher approve the test setup. Never test with a person riding the prototype.']],example:'Practice calculation (not your prototype): A small 0.5 kg cart moving at 2 m/s has 1 J of kinetic energy. That is the energy that must be transferred for it to stop; it does not determine the peak stopping force by itself.',quiz:[['A fair comparison between two brakes should ideally keep which factor constant?',['Initial speed','Brake material','The outcome'],0,'Control initial conditions when comparing braking mechanisms.'],['If your stopping distance is inconsistent across trials, you should…',['Hide unusual results','Repeat tests and investigate variability','Assume the longest is wrong'],1,'Repeated trials help reveal variability and measurement error.'],['To calculate average deceleration from speed and stopping time, you must…',['Assume a constant deceleration for a simple model','Know only mass','Ignore initial speed'],0,'The simplified model uses a = Δv/Δt, and constant acceleration for distance predictions.']],prompts:[['Design sketch','Describe your stopping mechanism and label where forces act. Draw a separate sketch on paper.'],['Predictions','Predict what happens to stopping time, distance, and force when mass or initial speed changes. Explain why.'],['Testing conditions','How will you vary mass? How will you measure initial speed, stopping time, and distance? What will you keep constant?'],['Variability and safety','How might wind, surface friction, alignment, or rider behavior affect a full-size design? How will you account for uncertainty?']],trials:true},
{title:'Evidence, Trade-Offs & Presentation',time:'25–30 min',intro:'Turn your analysis and test results into a clear, defensible engineering recommendation.',sections:[['Claim → Evidence → Reasoning','Claim: State what you recommend. Evidence: Cite measurements, calculations, diagrams, or observations. Reasoning: Explain the relevant law and why the evidence supports your claim.'],['Evaluate trade-offs','Compare safety, thrill, cost, maintenance, energy use, and performance for minimum and maximum rider masses. A good proposal acknowledges limitations and explains why the benefits outweigh them.'],['Know what the data cannot prove','A classroom prototype cannot independently establish the safety of a full-size amusement ride. Explain which tests, engineering calculations, and independent safety reviews would still be needed.'],['Presentation structure','Problem → physics explanation → force diagrams → proposed changes → prototype design → test method and results → trade-offs → conclusion.']],example:'Evidence example (unrelated to the project): “The modified toy-cart ramp produced a shorter average travel time in three trials. Because the start point was unchanged, this suggests higher average speed, although timing uncertainty and friction differences should be considered.”',quiz:[['Which statement is evidence rather than a claim?',['This brake is best','The cart stopped in 0.8, 0.9, and 0.8 seconds','The brake should be safer'],1,'Measured observations are evidence.'],['A prototype succeeds in three trials. What is the strongest conclusion?',['Full-size safety is proven','It worked in those tested conditions','No further testing is needed'],1,'Results support only the conditions tested.'],['A good engineering trade-off explanation should…',['Ignore disadvantages','Describe benefits and costs using physics and evidence','Choose the cheapest option automatically'],1,'Strong engineering decisions consider constraints and evidence.']],prompts:[['State your recommendation','What is your design choice? Summarize your evidence and explain the relevant laws.'],['Discuss trade-offs','What might your design cost in materials, maintenance, energy, or thrill? How do these compare to its benefits?'],['Identify limitations','What did you not test? What would engineers need to establish before a full-size ride could be considered safe?'],['Prepare your presentation','Outline the slides or sections you will present to Innovation-7.']]}
];
const KEY='physics-park-course-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.completed??={};state.answers??={};state.writing??={};state.trials??=[];state.current??=0;let current=Math.min(state.current,lessons.length-1);const save=()=>{state.current=current;try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(i,j)=>`${i}:${j}`;function unlocked(i){return i===0||!!state.completed[i-1]};function render(){if(!unlocked(current))current=0;const l=lessons[current],a=state.answers[current]||{};document.getElementById('progressText').textContent=`${Object.values(state.completed).filter(Boolean).length} of 6 lessons complete`;document.getElementById('progressBar').style.width=`${100*Object.values(state.completed).filter(Boolean).length/6}%`;document.getElementById('nav').innerHTML=lessons.map((x,i)=>`<button data-nav="${i}" ${unlocked(i)?'':'disabled'} class="${i===current?'active':''}">${state.completed[i]?'✓ ':unlocked(i)?'':'🔒 '}${i+1}. ${esc(x.title)}</button>`).join('');let html=`<div class="eyebrow">Lesson ${current+1} of 6 · ${esc(l.time)}</div><h2>${esc(l.title)}</h2><p>${esc(l.intro)}</p><div class="callout"><b>Your goal:</b> Learn the principle, practice with an unrelated example, then use your own reasoning for the assignment. No completed ride solutions are supplied.</div>`;l.sections.forEach(([h,t])=>html+=`<h3>${esc(h)}</h3><p>${esc(t)}</p>`);if(l.diagram)html+=`<div class="example"><b>Free-body diagram: stationary book</b><svg viewBox="0 0 450 210" role="img" aria-label="Book with upward normal force and downward gravity"><rect x="110" y="112" width="150" height="45" rx="5" fill="#aac6df" stroke="#40688c"/><line x1="185" y1="112" x2="185" y2="25" stroke="#1b8755" stroke-width="4"/><polygon points="185,17 177,34 193,34" fill="#1b8755"/><line x1="185" y1="157" x2="185" y2="192" stroke="#c16b2c" stroke-width="4"/><polygon points="185,201 177,184 193,184" fill="#c16b2c"/><text x="205" y="40" fill="#1b8755">Normal force (N)</text><text x="205" y="190" fill="#a45922">Weight (mg)</text></svg><p>Practice: draw your own diagram of a box sliding on a rough floor. Add friction and explain its direction.</p></div>`;html+=`<div class="example"><b>Worked example</b><p>${esc(l.example)}</p></div>`;if(l.sim)html+=`<div class="example"><h3>Interactive stopping-time explorer</h3><p class="small">Illustrative cart only. Assume uniform deceleration to rest. Adjust the sliders.</p><label>Mass: <output id="mVal">20</output> kg<input id="mass" type="range" min="5" max="50" step="5" value="20"></label><label>Initial speed: <output id="vVal">4</output> m/s<input id="speed" type="range" min="1" max="12" value="4"></label><label>Stopping time: <output id="tVal">2</output> s<input id="stop" type="range" min="0.5" max="5" step="0.5" value="2"></label><div class="grid"><div class="metric">Average deceleration magnitude<strong id="accel"></strong>m/s²</div><div class="metric">Average net stopping force<strong id="force"></strong>newtons</div><div class="metric">Initial kinetic energy<strong id="energy"></strong>joules</div><div class="metric">Stopping distance (constant deceleration)<strong id="distance"></strong>meters</div></div><p class="small">Notice: These are averages and idealized values, not maximum forces or a ride safety certification.</p></div>`;html+='<h3>Knowledge check</h3><p>Answer all questions correctly to unlock the next lesson. You can retry without penalty.</p>';l.quiz.forEach(([q,opts,correct,why],j)=>{let chosen=a[j];html+=`<div class="question"><b>${j+1}. ${esc(q)}</b>${opts.map((o,k)=>`<label><input type="radio" name="q${j}" value="${k}" ${chosen===k?'checked':''}> ${esc(o)}</label>`).join('')}<div class="feedback" id="fb${j}">${chosen===undefined?'':chosen===correct?`<span class="ok">Correct. ${esc(why)}</span>`:`<span class="no">Not quite. Review the concept and try again.</span>`}</div></div>`});html+='<h3>Assignment thinking journal</h3><p class="small">These are your own responses. They are saved on this device and included in the export.</p>';l.prompts.forEach(([h,p],j)=>html+=`<div class="prompt"><label for="write${j}">${esc(h)}</label><p>${esc(p)}</p><textarea id="write${j}" data-write="${j}" placeholder="Write your own reasoning here...">${esc(state.writing[key(current,j)]||'')}</textarea></div>`);if(l.trials){html+='<h3>Prototype testing log</h3><p>Enter measurements from real trials. Use total moving mass, including the car and any added load. Leave unavailable measurements blank rather than guessing.</p><div class="tablewrap"><table><thead><tr><th>Trial</th><th>Mass (kg)</th><th>Speed (m/s)</th><th>Time (s)</th><th>Distance (m)</th></tr></thead><tbody>';for(let i=0;i<6;i++){const r=state.trials[i]||{};html+=`<tr><td>${i+1}</td>${['mass','speed','time','distance'].map(f=>`<td><input aria-label="Trial ${i+1} ${f}" type="number" step="any" min="0" data-trial="${i}" data-field="${f}" value="${esc(r[f]||'')}"></td>`).join('')}</tr>`}html+='</tbody></table></div>'}const ready=l.quiz.every((q,j)=>a[j]===q[2]);html+=`<div class="footer"><p id="status">${ready?'✓ Knowledge check passed.':'Complete all three questions correctly to unlock the next lesson.'}</p><button class="action" id="complete" ${ready?'':'disabled'}>${state.completed[current]?'Lesson completed ✓':current===5?'Finish course':'Complete lesson and unlock next →'}</button><button class="action secondary" id="prev" ${current===0?'disabled':''}>← Previous lesson</button></div>`;document.getElementById('lesson').innerHTML=html;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{current=+b.dataset.nav;save();render();scrollTo(0,0)});document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{const j=+el.name.slice(1);(state.answers[current]??={})[j]=+el.value;save();render()});document.querySelectorAll('[data-write]').forEach(el=>el.oninput=()=>{state.writing[key(current,+el.dataset.write)]=el.value;save()});document.querySelectorAll('[data-trial]').forEach(el=>el.oninput=()=>{const i=+el.dataset.trial;(state.trials[i]??={})[el.dataset.field]=el.value;save()});document.getElementById('complete').onclick=()=>{if(!ready)return;state.completed[current]=true;if(current<5)current++;save();render();scrollTo(0,0)};document.getElementById('prev').onclick=()=>{current=Math.max(0,current-1);save();render();scrollTo(0,0)};if(l.sim){const update=()=>{const m=+document.getElementById('mass').value,v=+document.getElementById('speed').value,t=+document.getElementById('stop').value;for(const [id,val] of Object.entries({mVal:m,vVal:v,tVal:t,accel:(v/t).toFixed(2),force:(m*v/t).toFixed(2),energy:(.5*m*v*v).toFixed(2),distance:(v*t/2).toFixed(2)}))document.getElementById(id).textContent=val};['mass','speed','stop'].forEach(id=>document.getElementById(id).oninput=update);update()}}
document.getElementById('exportBtn').onclick=()=>{let out='PHYSICS DESIGN LAB — STUDENT WORK\n\n';lessons.forEach((l,i)=>{out+=`LESSON ${i+1}: ${l.title}\nStatus: ${state.completed[i]?'Completed':'Not completed'}\n`;l.prompts.forEach(([h,p],j)=>out+=`\n${h}\n${p}\n${state.writing[key(i,j)]||'[No response yet]'}\n`);out+='\n'});out+='PROTOTYPE TRIALS\nTrial,Mass (kg),Speed (m/s),Stopping time (s),Stopping distance (m)\n';state.trials.forEach((r,i)=>out+=`${i+1},${r?.mass||''},${r?.speed||''},${r?.time||''},${r?.distance||''}\n`);const blob=new Blob([out],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='physics-design-lab-student-work.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('printBtn').onclick=()=>print();render();
</script></body></html>
